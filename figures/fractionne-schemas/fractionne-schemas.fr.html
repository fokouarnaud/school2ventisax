body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

dre des phases ; chaque bobinage est câblé en étoile." font-family="Arial, sans-serif" font-weight="bold"></svg></figure></div><ol class="st-log" aria-label="Contacts qui basculent" aria-live="polite" hidden></ol><ol class="st-steps"><li data-stage="rest">Repos : sous tension, B1 fermé</li><li data-stage="press">S1 : bobines K1 et K1T alimentées</li><li data-stage="pull">K1 colle : 13-14 se ferme, 1er bobinage alimenté</li><li data-stage="half">Auto-maintien, 1er temps, temporisation ≤ 1 s</li><li data-stage="timeout">Le contact de K1T se ferme : K2 alimenté</li><li data-stage="full">K2 colle : 2e temps, les deux bobinages</li></ol></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Conducteur parcouru par un courant (tirets qui avancent), bobine alimentée (pleine)</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Coffret : B1, K1, temporisateur K1T, K2, F1, F2, S1, S0</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Câbles vers les bornes 1-2-3 (K1, 1er bobinage) et 4-5-6 (K2, 2e bobinage)</span></span><span class="iso-caption">Le compresseur possède deux bobinages indépendants, câblés chacun en étoile. L'impulsion sur S1 traverse le contact du module de protection B1, les contacts 95-96 de F1 et de F2 et S0, puis alimente la bobine de K1 et celle du temporisateur K1T ; K1 s'auto-maintient par 13-14. 1er temps : K1 alimente le premier bobinage (bornes 1, 2, 3), qui n'absorbe qu'environ 60 % du courant d'appel du démarrage direct. 2e temps : au bout de la temporisation (1 s au maximum), le contact de K1T se ferme et alimente K2, qui met le second bobinage (bornes 4, 5, 6) sous tension, dans le même ordre des phases. Un défaut thermique sur F1 ou F2, ou une surchauffe signalée par les sondes PTC à B1, arrête tout le moteur. Valeurs typiques ; démarrage montré 4 fois ralenti.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;

const tenth = (value) => {

function extrude(ring, z, height, projection, options = {}) {

function ladder(svgEl, schema) {

const still = matchMedia("(prefers-reduced-motion: reduce)");
const C = FIG, T = TX, P = C.P;

const feedback = scope.querySelector(".mv-feedback");

const ctrl = ladder(scope.querySelector('.ld-svg[data-schema="control"]'), D.STARTERS[NAME].control);

// une ligne par contact qui bascule ou bobine qui change d'état : « KM1 13-14 se ferme », « KM1 55-56 (temporisé) s'ouvre »

buttons.start.addEventListener("click", start);
buttons.step.addEventListener("click", toggleStep);
buttons.next.addEventListener("click", resume);
buttons.stop.addEventListener("click", stop);

if (buttons.fault2) buttons.fault2.addEventListener("click", () => fault(FAULTS[1], "trip2"));
