<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The pressure regulator: explore and practise</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

.iso-stage{touch-action:manipulation}
.iso-plate-corner[data-corner="hint"]{top:20px;bottom:auto;right:0;white-space:normal;line-height:1.35}
.iso-plate-corner[data-corner="readout"]{left:0;white-space:normal;text-align:right;line-height:1.4}
.iso-plate{padding-top:80px}
.mv-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.mv-controls button{font:12px/1.2 var(--anatomy-mono);letter-spacing:.04em;color:var(--anatomy-strong);background:var(--anatomy-card);border:1px solid var(--anatomy-mid);border-radius:999px;padding:12px 14px;min-height:44px;cursor:pointer}
.mv-controls button[aria-pressed="true"]{border-color:var(--anatomy-lit);box-shadow:inset 0 0 0 1px var(--anatomy-lit)}
.mv-controls button:focus-visible{outline:2px solid var(--anatomy-hi);outline-offset:2px}
.mv-controls button:disabled{opacity:.45;cursor:default}
.mv-feedback{margin:12px 0 0;min-height:3em;color:var(--anatomy-text);font-size:13px;line-height:1.55}
.mv-score{color:var(--anatomy-muted);font:11px/1 var(--anatomy-mono);margin-top:6px}
@media (max-width:560px){.iso-plate{padding:76px 12px 64px}.mv-controls button{flex:1 1 40%}}

.rc-hole{fill:var(--anatomy-page);stroke:var(--anatomy-mid);stroke-width:.5}
.rc-halo{opacity:.7}
g[data-tint="cuivre"]{filter:sepia(.8) saturate(2.4) hue-rotate(-14deg) brightness(1.9)}
g[data-tint="laiton"]{filter:sepia(.9) saturate(1.7) hue-rotate(8deg) brightness(2)}
g[data-tint="acier"]{filter:brightness(1.5)}
g[data-tint="pvc"]{filter:brightness(2.1)}
g[data-tint="gaine"]{filter:sepia(.7) saturate(2.6) hue-rotate(-30deg) brightness(1.8)}
[data-theme="light"] g[data-tint="cuivre"]{filter:sepia(1) saturate(4) hue-rotate(-38deg) brightness(.78)}
[data-theme="light"] g[data-tint="laiton"]{filter:sepia(1) saturate(2.2) hue-rotate(6deg) brightness(.85)}
[data-theme="light"] g[data-tint="acier"],[data-theme="light"] g[data-tint="pvc"]{filter:none}
[data-theme="light"] g[data-tint="gaine"]{filter:sepia(1) saturate(3) hue-rotate(-32deg) brightness(.85)}
.rc-tag circle{fill:var(--anatomy-card);stroke:var(--anatomy-mid);stroke-width:.8}
.rc-tag text{font:600 9px/1 var(--anatomy-mono);fill:var(--anatomy-strong)}
.rc-prompt{margin:16px 0 0;min-height:1.6em;color:var(--anatomy-strong);font-weight:600;line-height:1.45}
.rc-quiz[hidden],.mv-controls button[hidden]{display:none}
.rc-options{flex-direction:column}
.rc-options button{text-align:left;border-radius:14px}
.rc-options button[data-state="right"]{border-color:var(--anatomy-lit);box-shadow:inset 0 0 0 1px var(--anatomy-lit)}
.rc-options button[data-state="wrong"]{border-style:dashed}
.rc-options button:disabled{opacity:1;cursor:default}

.md-face{fill:var(--anatomy-card);stroke:var(--anatomy-mid);stroke-width:.6}
.md-num{font:600 6px/1 var(--anatomy-mono);fill:var(--anatomy-strong)}
.md-unit{font:3.8px/1 var(--anatomy-mono);fill:var(--anatomy-muted);letter-spacing:.04em}
.md-needle{stroke:var(--anatomy-lit);stroke-width:1.1;stroke-linecap:round;transition:d .4s ease}
.md-hub{fill:var(--anatomy-lit)}
.md-dial[data-lit] .md-face{stroke:var(--anatomy-lit);stroke-width:1.4}
.md-explore[hidden],.rc-quiz[hidden]{display:none}
.md-scene[data-gas="acetylene"] .md-bottle,.md-scene[data-gas="acetylene"] .md-hose{filter:sepia(1) saturate(4) hue-rotate(-50deg) brightness(.9)}
.md-scene[data-gas="propane"] .md-bottle{filter:sepia(1) saturate(3) hue-rotate(-20deg)}
.md-scene[data-gas="oxygene"] .md-hose{filter:sepia(1) saturate(4) hue-rotate(170deg)}
.md-scene[data-gas="azote"] .md-bottle{filter:brightness(.7)}
.md-scene[data-gas="co2"] .md-bottle{filter:brightness(.85)}
@media (prefers-reduced-motion:reduce){.md-needle{transition:none}}

-label="Figure mode"><button type="button" disabled data-act="explore">Explore</button><button type="button" disabled data-act="quiz">Practise</button></div><div class="md-explore"><div class="mv-controls" role="group" aria-label="Regulator controls"><button type="button" disabled data-act="gas">Change gas</button><button type="button" disabled data-act="open">Open the cylinder</button><button type="button" disabled data-act="minus">Screw: back off</button><button type="button" disabled data-act="plus">Screw: turn in</button></div></div><p class="rc-prompt" aria-live="polite"></p><div class="rc-quiz" hidden><div class="mv-controls rc-options" role="group" aria-label="Possible answers"></div><div class="mv-controls"><button type="button" disabled data-act="again">Next situation</button><button type="button" disabled data-act="series">New series</button></div></div><p class="mv-feedback" aria-live="polite"></p><p class="mv-score" aria-live="polite"></p></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Cylinder, regulator, HP and LP gauges, adjusting screw, hose</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Gauge to read</span></span><span class="iso-caption">The inlet gauge (HP) reads the cylinder pressure; the outlet gauge (LP) reads the working pressure sent to the torch, set with the adjusting screw: turn it in to raise, back it off to lower. Maximum working pressure (handout): acetylene 1.5 bar, propane 4 bar, oxygen, nitrogen and CO2 10 bar. The screw is backed off before opening the cylinder. Cylinder pressures in Explore mode are orders of magnitude. Each series draws 10 situations out of more than 1,000; nothing is recorded.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {

  svg.querySelector('.md-needle[data-dial="' + dial + '"]').setAttribute("d", "M" + tail[0].toFixed(1) + " " + tail[1].toFixed(1) + "L" + tip[0].toFixed(1) + " " + tip[1].toFixed(1));
}
function lit(dial) { for (const g of svg.querySelectorAll(".md-dial")) g.toggleAttribute("data-lit", g.dataset.dial === dial); }
// ---------------------------------------------------------------- Explorer
let gi = 2, open = false, screw = 0, hp = 0, warned = false;
function drawExplore() {
  if (!quizBox.hidden) return;
  const id = GAS_IDS[gi], g = CAT.gases[id];
  setGas(id);
  const bp = open ? Math.min(screw, hp) : 0;
  needle("amont", open ? hp : 0, g.high); needle("aval", bp, g.low); lit(null);
  const warn = bp > g.detent + 1e-9;
  readout.textContent = TX.explore(gasName(id), open, X(open ? hp : 0, 0), X(bp, 2), warn);
  if (warn && !warned) { feedback.textContent = TX.warn(X(g.detent, 1)); warned = true; }
  if (!warn) warned = false;
  buttons.open.textContent = open ? TX.buttons.close : TX.buttons.open;
}
const X = (v, d) => String(Math.round(v * 10 ** d) / 10 ** d).replace(".", LANG === "fr" ? "," : ".");
function step(dt) { const g = CAT.gases[GAS_IDS[gi]]; if (open && screw > 0 && hp > 0) hp = Math.max(0, hp - dt * screw * g.high / 900); drawExplore(); }
const run = loop(step, () => open && screw > 0);
buttons.gas.addEventListener("click", () => { gi = (gi + 1) % GAS_IDS.length; open = false; screw = 0; hp = BOTTLE[GAS_IDS[gi]]; feedback.textContent = ""; drawExplore(); });
buttons.open.addEventListener("click", () => {
  if (!open && screw > 0) feedback.textContent = TX.closedScrew; else if (!open) feedback.textContent = "";
  open = !open; if (open && hp <= 0) hp = BOTTLE[GAS_IDS[gi]]; drawExplore(); run();
});
buttons.plus.addEventListener("click", () => { const g = CAT.gases[GAS_IDS[gi]]; screw = Math.min(g.low, Math.round((screw + g.low / 10) * 100) / 100); drawExplore(); run(); });
buttons.minus.addEventListener("click", () => { const g = CAT.gases[GAS_IDS[gi]]; screw = Math.max(0, Math.round((screw - g.low / 10) * 100) / 100); drawExplore(); });
// ---------------------------------------------------------------- Séries
const pool = { 1: [], 2: [], 3: [], 4: [] };
CAT.situations.forEach((s) => pool[s.level].push(s));
const PLAN = [1, 1, 1, 2, 2, 2, 3, 3, 4, 4];
let list = [], at = 0, good = 0, answered = false;
const stepsOf = (p) => CAT[p];
function label(s, o) {
  if (s.kind === "manometre") return TX.gauges[o];
  if (s.kind === "lecture" || s.kind === "detente") return TX.bar(o);
  if (s.kind === "detendeur") return TX.regulator(o);
  if (s.kind === "reglage") return TX.reglage[o];
  return stepsOf(s.procedure).find((x) => x.id === o).label[LANG];
}
function showSituation(s) {
  const g = s.gas ? CAT.gases[s.gas] : null;
  if (s.gas) setGas(s.gas);
  needle("amont", s.kind === "lecture" && s.gauge === "amont" ? s.needle : g ? g.high * 0.6 : 0, g ? g.high : 1);
  needle("aval", s.kind === "lecture" && s.gauge === "aval" ? s.needle : s.kind === "reglage" ? s.value : g ? g.detent * 0.5 : 0, g ? g.low : 1);
  lit(s.kind === "lecture" ? s.gauge : null);
  const name = s.gas ? TX.gas(gasName(s.gas)) : "";
  const A = TX.ask;
  prompt.textContent = s.kind === "manometre" ? A.manometre(name, s.reads) : s.kind === "lecture" ? A.lecture(name, s.gauge) : s.kind === "detente" ? A.detente(name)
    : s.kind === "detendeur" ? A.detendeur(gasName(s.gas)) : s.kind === "reglage" ? A.reglage(name, X(s.value, 2)) : A.ordre(s.procedure, stepsOf(s.procedure)[s.after].label[LANG]);
  readout.textContent = "";
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function show() {
  answered = false;
  const s = list[at];
  showSituation(s);
  optionsBox.replaceChildren(...s.options.slice().sort(() => Math.random() - 0.5).map((o) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label(s, o); b._o = o;
    b.addEventListener("click", () => answer(o)); return b;
  }));
  feedback.textContent = "";
  buttons.again.disabled = true;
  scoreEl.textContent = TX.score(good, at) + " · " + TX.step(at + 1, list.length);
}
function answer(o) {
  if (answered) return;
  answered = true;
  const s = list[at], ok = same(o, s.answer);
  if (ok) good++;
  for (const b of optionsBox.children) {
    b.disabled = true;
    if (same(b._o, s.answer)) { b.dataset.state = "right"; b.prepend("✓ "); b.setAttribute("aria-label", TX.marks.right + " : " + b.textContent.slice(2)); }
    else if (same(b._o, o)) { b.dataset.state = "wrong"; b.prepend("✗ "); b.setAttribute("aria-label", TX.marks.wrong + " : " + b.textContent.slice(2)); }
  }
  const last = at === list.length - 1;
  feedback.textContent = [ok ? TX.right : TX.wrong(label(s, s.answer)), s.gas ? TX.why(CAT.gases[s.gas]) : "", last ? TX.done(good, list.length) : ""].filter(Boolean).join(" ");
  if (s.kind === "manometre") lit(s.answer === "vis" ? null : s.answer);
  buttons.again.disabled = last;
  scoreEl.textContent = TX.score(good, at + 1) + " · " + TX.step(at + 1, list.length);
}
function start() {
  list = [];
  // Dans un niveau, on tire d'abord le type de situation : les 173 réglages n'écrasent pas l'ordre ni le choix du détendeur.
  for (const level of PLAN) {
    const kinds = {};
    pool[level].forEach((x) => (kinds[x.kind] ||= []).push(x));
    const groups = Object.values(kinds);
    let s;
    for (let i = 0; i < 40; i++) { const g = groups[Math.floor(Math.random() * groups.length)]; s = g[Math.floor(Math.random() * g.length)]; if (!list.includes(s)) break; }
    list.push(s);
  }
  at = 0; good = 0; show();
}
buttons.again.addEventListener("click", () => { if (at < list.length - 1) { at++; show(); } });
buttons.series.addEventListener("click", start);
function setMode(m) {
  buttons.explore.setAttribute("aria-pressed", m === "explore");
  buttons.quiz.setAttribute("aria-pressed", m === "quiz");
  exploreBox.hidden = m !== "explore"; quizBox.hidden = m !== "quiz";
  if (m === "explore") { prompt.textContent = ""; scoreEl.textContent = ""; feedback.textContent = ""; hp = BOTTLE[GAS_IDS[gi]]; drawExplore(); }
  else { open = false; screw = 0; start(); }
}
buttons.explore.addEventListener("click", () => setMode("explore"));
buttons.quiz.addEventListener("click", () => setMode("quiz"));
for (const b of scope.querySelectorAll(".mv-controls button")) b.disabled = false;
window.__md = { setMode, answer: (i) => answer(list[at].options[i]), current: () => list[at] };
setMode("explore");
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
</script></body></html>
