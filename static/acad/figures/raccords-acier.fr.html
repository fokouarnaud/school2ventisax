se"><strong>Coude</strong><span><em>Filetage</em> Mâle / mâle, mâle / femelle ou femelle / femelle</span><span><em>Fonction</em> Changer de direction</span><span><em>Particularité</em> Forme un angle, le plus souvent 90° ou 45°</span></button></li><li><button type="button" disabled data-fit="union" aria-pressed="false"><strong>Union (3 pièces)</strong><span><em>Filetage</em> Trois pièces : deux embouts et un écrou libre</span><span><em>Fonction</em> Raccorder en restant démontable</span><span><em>Particularité</em> Démonte un appareil sans tourner les tuyaux</span></button></li><li><button type="button" disabled data-fit="te" aria-pressed="false"><strong>Té</strong><span><em>Filetage</em> Trois voies, femelles (ou mâles)</span><span><em>Fonction</em> Créer une dérivation</span><span><em>Particularité</em> Trois ouvertures en T, la dérivation à 90°</span></button></li><li><button type="button" disabled data-fit="bouchon" aria-pressed="false"><strong>Bouchon (ou capuchon)</strong><span><em>Filetage</em> Mâle seul (bouchon) ou femelle seul (capuchon)</span><span><em>Fonction</em> Fermer une conduite</span><span><em>Particularité</em> Une seule ouverture, fond plein</span></button></li></ul></div><div class="rc-quiz" hidden><div class="mv-controls rc-options" role="group" aria-label="Réponses proposées"></div><div class="mv-controls"><button type="button" disabled data-act="again">Situation suivante</button><button type="button" disabled data-act="series">Nouvelle série</button></div></div><p class="mv-feedback" aria-live="polite"></p><p class="mv-score" aria-live="polite"></p></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Raccord en acier : corps, filetages, six pans</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Repères : M mâle (filet extérieur), F femelle (filet intérieur)</span></span><span class="iso-caption">Mâle : filetage à l'extérieur ; femelle : filetage à l'intérieur ; on assemble toujours un mâle avec un femelle. Manchon F/F pour prolonger, mamelon M/M pour relier deux femelles, réduction pour changer de diamètre, coude pour changer de direction, union 3 pièces pour pouvoir démonter, té pour dériver, bouchon ou capuchon pour fermer. Ces raccords filetés servent aux tuyauteries d'eau ou d'acier galvanisé, jamais au circuit frigorifique. Rien n'est enregistré.</span></figcaption></figure></div>
