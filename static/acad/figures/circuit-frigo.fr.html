4 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Point du circuit à identifier</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Compresseur, condenseur, détendeur et évaporateur</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Sens de circulation du fluide</span></span><span class="iso-caption">Le compresseur aspire la vapeur surchauffée basse pression venant de l'évaporateur (point 1) et la refoule en vapeur chaude haute pression (point 2). Dans le condenseur, elle se désurchauffe (3), se condense en mélange (4) puis se sous-refroidit (5, 6). Le liquide sous-refroidi arrive au détendeur (7), qui fait chuter la pression : une partie s'évapore aussitôt (8). Dans l'évaporateur, le liquide s'évapore en absorbant la chaleur du milieu à refroidir, jusqu'à la vapeur surchauffée (9).</span></figcaption></figure></div>
