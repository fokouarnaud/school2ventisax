n class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Aiguille repère du vacuomètre : 1 mbar, la valeur visée</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Jeu de manifolds (BP, Vac, HP), pompe à vide et circuit</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Flexible en dépression</span></span><span class="iso-caption">Le manomètre de manifold indique une pression relative : dès que le circuit est proche du vide, son aiguille reste à -1 bar, que la pression absolue soit de 50 mbar ou de 1 mbar. Seul le vacuomètre, en pression absolue et à échelle logarithmique, montre le vide réellement atteint. Une fois sous l'aiguille repère, on referme les bypass et on observe : la pression presque immobile indique un circuit sec et étanche ; une montée qui se stabilise indique de l'humidité, il faut poursuivre le tirage ; une montée sans arrêt indique une fuite, il faut la rechercher. Le temps de la figure est très accéléré.</span></figcaption></figure></div>
