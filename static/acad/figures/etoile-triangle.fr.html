"><figcaption class="ld-cap">Circuit de puissance</figcaption><svg class="ld-svg" data-schema="power" viewBox="0 0 410 450" role="img" aria-label="Circuit de puissance du démarrage étoile-triangle : Q, fusibles, KM1 vers U1, V1, W1 ; U2, V2, W2 par le relais thermique F vers KM2 (point étoile) et vers KM3 (U2 vers V1, V2 vers W1, W2 vers U1)." font-family="Arial, sans-serif" font-weight="bold"></svg></figure></div><ol class="st-log" aria-label="Contacts qui basculent" aria-live="polite" hidden></ol><ol class="st-steps"><li data-stage="rest">Repos : sous tension, Q fermé</li><li data-stage="press">S1 : la bobine KM1 est alimentée</li><li data-stage="pull">KM1 colle : 13-14 se ferme, KM2 alimenté par 55-56</li><li data-stage="star">Auto-maintien, étoile, temporisation</li><li data-stage="switch">55-56 s'ouvre au travail : KM2 retombe, puis 67-68 se ferme</li><li data-stage="delta">KM3 colle : triangle, KM2 verrouillé</li></ol></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Conducteur parcouru par un courant (tirets qui avancent), bobine alimentée (pleine)</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Coffret : Q, KM1 et son bloc temporisé, KM2, KM3, verrouillage, F, S1, S0</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Câbles vers U1, V1, W1 (KM1) et vers U2, V2, W2 (F, puis KM2 ou KM3)</span></span><span class="iso-caption">Le moteur, couplé en triangle sous 400 V, a ses barrettes retirées : les couplages se font par les contacteurs. 1er temps : l'impulsion sur S1 alimente KM1, qui s'auto-maintient par 13-14 ; le contact temporisé 55-56, encore fermé, et le contact 21-22 de KM3 alimentent KM2, qui réunit U2, V2, W2 : couplage étoile, chaque enroulement sous 400 / √3 ≈ 230 V, courant de démarrage divisé par 3 environ. 2e temps : à la fin de la temporisation du bloc monté sur KM1, 55-56 s'ouvre au travail et KM2 retombe ; son contact 21-22 se referme et 67-68, fermé au travail, alimente KM3 : U2 → V1, V2 → W1, W2 → U1, couplage triangle. KM2 et KM3 ne sont jamais fermés ensemble (verrouillages électrique et mécanique). Temporisation réglée ici à 5 s (valeur d'exemple) ; courant en multiples de In, valeurs typiques ; mouvement des contacteurs ralenti.</span></figcaption></figure></div>
