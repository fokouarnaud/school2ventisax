lta Δ connection: each winding gets the line voltage of the supply; choose it when that equals the lower plate voltage (400/690 V motor on a 230/400 V supply: 400 V per winding). Star Y connection: each winding gets the line voltage divided by √3; choose it when the line voltage equals the higher plate voltage (230/400 V motor on a 230/400 V supply: 400 / √3 = 230 V). If neither plate voltage is the supply's line voltage, the motor cannot be connected to it. Remember: 3 links = delta, 1 link across the bottom row = star.</span></figcaption></figure></div>
