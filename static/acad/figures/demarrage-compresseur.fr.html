e le contact K : l'enroulement auxiliaire démarre le moteur. Dès que le moteur prend sa vitesse, le courant baisse et K s'ouvre ; il reste le courant nominal. Si K ne ferme pas, le moteur grogne sans démarrer, le courant reste très élevé et le protecteur thermique coupe. Si K reste fermé, le moteur tourne mais l'auxiliaire reste alimenté : le courant reste au-dessus du nominal et le protecteur finit par couper. Le temps de la figure est accéléré.</span></figcaption></figure></div>
