." font-family="Arial, sans-serif" font-weight="bold"></svg></figure></div><ol class="st-log" aria-label="Contacts switching over" aria-live="polite" hidden></ol><ol class="st-steps"><li data-stage="rest">Off: live, B1 closed</li><li data-stage="press">S1: K1 and K1T coils energised</li><li data-stage="pull">K1 pulls in: 13-14 closes, first winding fed</li><li data-stage="half">Hold-in, first step, timing ≤ 1 s</li><li data-stage="timeout">K1T contact closes: K2 energised</li><li data-stage="full">K2 pulls in: second step, both windings</li></ol></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Conductor carrying current (moving dashes), energised coil (filled)</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Panel: B1, K1, on-delay timer K1T, K2, F1, F2, S1, S0</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Cables to terminals 1-2-3 (K1, first winding) and 4-5-6 (K2, second winding)</span></span><span class="iso-caption">The compressor has two independent windings, each star-connected. The press on S1 passes through the protection module B1 contact, the 95-96 contacts of F1 and F2 and S0, then energises the K1 coil and the on-delay timer K1T coil; K1 holds itself in through 13-14. First step: K1 feeds the first winding (terminals 1, 2, 3), which draws only about 60 % of the direct-on-line inrush current. Second step: when the timer runs out (1 s at most), the K1T contact closes and energises K2, which feeds the second winding (terminals 4, 5, 6) in the same phase order. A thermal fault on F1 or F2, or overheating reported to B1 by the PTC sensors, stops the whole motor. Typical values; start shown 4 times slower.</span></figcaption></figure></div>
